name: PR checks

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Conventional Commits title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          regex='^(feat|fix|docs|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9][a-z0-9._/-]*\))?!?: .+'
          if ! [[ "$TITLE" =~ $regex ]]; then
            echo "::error::PR title must follow Conventional Commits: type(scope): description"; exit 1
          fi

  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          other=$(git diff --name-only "$BASE"...HEAD | grep -Ev '^(docs/|openspec/)|\.md$' || true)
          if [ -z "$other" ]; then echo "docs_only=true" >> "$GITHUB_OUTPUT"; else echo "docs_only=false" >> "$GITHUB_OUTPUT"; fi

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: "10.0.x" }
      - name: C# quality (dotnet format, analyzers, compiler)
        run: |
          python3 harness/onboarding/scripts/gen_snk.py "$RUNNER_TEMP/key.snk"   # temporary strong-name key
          for s in $(find backend -maxdepth 3 -name '*.sln'); do
            dotnet format "$s" --verify-no-changes && dotnet build "$s" -warnaserror -p:StrongNameKeyFile="$RUNNER_TEMP/key.snk"
          done
      - uses: actions/setup-node@v7
        with: { node-version: "lts/*" }
      - name: React quality (ESLint, Prettier, TypeScript)
        run: |
          for d in $(find frontend -maxdepth 2 -name package.json -exec dirname {} \;); do
            (cd "$d" && npm ci && npm run lint && npx prettier --check . && npx tsc --noEmit)
          done

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: "10.0.x" }
      - name: C# unit tests (coverage >= 80%)
        run: |
          python3 harness/onboarding/scripts/gen_snk.py "$RUNNER_TEMP/key.snk"
          for s in $(find backend -maxdepth 3 -name '*.sln'); do
            dotnet test "$s" --filter "Category!=Integration" /p:CollectCoverage=true /p:Threshold=80 /p:ThresholdType=line -p:StrongNameKeyFile="$RUNNER_TEMP/key.snk"
          done
      - uses: actions/setup-node@v7
        with: { node-version: "lts/*" }
      - name: React unit tests (coverage >= 80%)
        run: |
          for d in $(find frontend -maxdepth 2 -name package.json -exec dirname {} \;); do
            (cd "$d" && npm ci && npx vitest run --coverage --coverage.thresholds.lines=80 --coverage.thresholds.functions=80 --coverage.thresholds.branches=80 --coverage.thresholds.statements=80)
          done

  # Only when there are backend projects. Always runs; docs-only PRs succeed without running the tests.
  integration-tests:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Docs-only change, integration tests skipped
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "Only documentation changed; nothing to run."
      - uses: actions/checkout@v7
        if: needs.changes.outputs.docs_only != 'true'
      - uses: actions/setup-dotnet@v6
        if: needs.changes.outputs.docs_only != 'true'
        with: { dotnet-version: "10.0.x" }
      - name: C# integration tests (Testcontainers)
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          python3 harness/onboarding/scripts/gen_snk.py "$RUNNER_TEMP/key.snk"
          for s in $(find backend -maxdepth 3 -name '*.sln'); do
            dotnet test "$s" --filter "Category=Integration" -p:StrongNameKeyFile="$RUNNER_TEMP/key.snk"
          done

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "chore(deps)" }
  # .NET 10 is an LTS line: stay on 10.x for the framework-aligned packages (security updates are not affected)
  - package-ecosystem: nuget
    directory: /backend
    schedule: { interval: weekly }
    commit-message: { prefix: "chore(deps)" }
    ignore:
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /frontend/lumia-web
    schedule: { interval: weekly }
    commit-message: { prefix: "chore(deps)" }
    ignore:
      # Node.js typings: only the LTS line in use
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Blocked by plugin peer ranges (see docs/adr/0001): eslint-plugin-jsx-a11y (ESLint <= 9)
      # and typescript-eslint (TypeScript < 6.1)
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
